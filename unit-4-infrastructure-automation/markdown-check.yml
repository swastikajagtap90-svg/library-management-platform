name: Documentation checks

on:
  push:
  pull_request:

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check required documentation files
        run: |
          test -f README.md
          test -f docs/installation-guide.md
          test -f docs/aws-authentication-and-ssh.md
          test -f docs/verification-and-troubleshooting.md
